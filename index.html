<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>思之流 · 把看过的东西，重新想一遍</title>
  <meta name="description" content="一个本地优先的回顾空间：收下看过的内容，写一句评价，打一个标签，慢慢看见自己的形状。">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    // Apply the saved theme before first paint to avoid a bright flash.
    try {
      var saved = localStorage.getItem("sizhiliu.state.v1");
      if (saved) {
        var parsed = JSON.parse(saved);
        var settings = parsed && parsed.settings;
        if (settings && settings.theme === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
        if (settings && settings.motion === false) {
          document.documentElement.dataset.motion = "off";
        }
      }
    } catch (err) {
      /* localStorage may be blocked; the app will fall back to light */
    }
  </script>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/shell.css">
  <link rel="stylesheet" href="styles/feed.css">
  <link rel="stylesheet" href="styles/card.css">
  <link rel="stylesheet" href="styles/tags.css">
  <link rel="stylesheet" href="styles/tree.css">
  <link rel="stylesheet" href="styles/settings.css">
  <link rel="stylesheet" href="styles/overlays.css">
</head>
<body>
  <a class="skip-link" href="#view">跳到主要内容</a>

  <div class="app">
    <aside class="rail" aria-label="思之流">
      <a class="brand" href="#/feed" aria-label="思之流 · 回到回看">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <path d="M6 13c4.2-4.6 8.4 4.6 12.6 0S31.4 8.4 35 13" />
          <path d="M6 21c4.2-4.6 8.4 4.6 12.6 0S31.4 16.4 35 21" class="brand-mark-accent" />
          <path d="M6 29c4.2-4.6 8.4 4.6 12.6 0S31.4 24.4 35 29" />
        </svg>
        <span class="brand-name" aria-hidden="true">思之流</span>
      </a>

      <nav class="rail-nav" aria-label="主导航">
        <a class="rail-link" href="#/feed" data-route="feed">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.25" y="4.25" width="7.5" height="7.5" rx="1.2" />
            <rect x="13.25" y="4.25" width="7.5" height="11.5" rx="1.2" />
            <rect x="3.25" y="14.25" width="7.5" height="5.5" rx="1.2" />
            <path d="M13.25 18.25h7.5" />
          </svg>
          <span>回看</span>
        </a>
        <a class="rail-link" href="#/tags" data-route="tags">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5 9.5 4h5L20 9.5" />
            <path d="M4 14h16" />
            <path d="M7 14v5.5M12 14v5.5M17 14v5.5" />
          </svg>
          <span>标签</span>
        </a>
        <a class="rail-link" href="#/tree" data-route="tree">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 21v-7" />
            <path d="M12 14c0-3-4-3-4-6V4" />
            <path d="M12 14c0-3 4-3 4-6V4" />
            <path d="M12 11c2.5 0 4-1.5 4.5-3" />
            <circle cx="8" cy="4" r="1" />
            <circle cx="16" cy="4" r="1" />
          </svg>
          <span>树</span>
        </a>
        <a class="rail-link" href="#/settings" data-route="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
            <circle cx="16" cy="7" r="2.2" />
            <circle cx="8" cy="17" r="2.2" />
          </svg>
          <span>设置</span>
        </a>
      </nav>

      <div class="rail-foot">
        <button class="rail-btn" id="theme-toggle" type="button" aria-label="切换深浅色" title="切换深浅色">
          <svg viewBox="0 0 24 24" aria-hidden="true" data-theme-icon="sun">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" />
          </svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" data-theme-icon="moon" hidden>
            <path d="M19.5 14.3A7.8 7.8 0 0 1 9.7 4.5a7.8 7.8 0 1 0 9.8 9.8Z" />
          </svg>
        </button>
        <button class="save-indicator" id="save-indicator" type="button" aria-label="数据保存状态" title="数据保存在这台电脑上">
          <span class="save-dot"></span>
          <span class="save-label" id="save-label">本地</span>
        </button>
      </div>
    </aside>

    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <div class="toast-root" id="toast-root" role="status" aria-live="polite"></div>
  <div class="overlay-root" id="overlay-root"></div>

  <noscript>
    <div class="noscript">思之流需要 JavaScript 才能运行。请在浏览器中启用 JavaScript 后刷新。</div>
  </noscript>

  <script src="js/core/util.js"></script>
  <script src="js/core/events.js"></script>
  <script src="js/data/model.js"></script>
  <script src="js/data/seed.js"></script>
  <script src="js/data/storage.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/services/search.js"></script>
  <script src="js/services/metadata.js"></script>
  <script src="js/ui/brand-icons.js"></script>
  <script src="js/ui/toast.js"></script>
  <script src="js/ui/dialog.js"></script>
  <script src="js/ui/flip.js"></script>
  <script src="js/ui/drawer.js"></script>
  <script src="js/views/card.js"></script>
  <script src="js/views/feed.js"></script>
  <script src="js/views/tags.js"></script>
  <script src="js/views/tree.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/capture.js"></script>
  <script src="js/views/command.js"></script>
  <script src="js/views/focus.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
